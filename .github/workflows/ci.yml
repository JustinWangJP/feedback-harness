name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install repository check tools
        shell: bash
        run: |
          set -eu
          make install-dev-tools
          npm ci --ignore-scripts
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify repository check tools
        shell: bash
        run: |
          set -eu
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
          ruff --version
          actionlint --version

      - name: Validate shell syntax
        run: bash -n scripts/*.sh scripts/checks/*.sh scripts/hooks/*.sh tests/*.sh

      - name: Validate Python syntax
        run: python3 -m py_compile scripts/*.py

      - name: Run regression tests
        run: bash tests/run_tests.sh

      - name: Run the harness against itself
        run: bash scripts/check.sh
